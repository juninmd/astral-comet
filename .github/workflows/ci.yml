name: CI
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm lint:ext
      - name: E2E (extension in Chromium)
        run: |
          npx playwright install --with-deps chromium
          CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")" npx playwright test
