<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leilão FIPE Helper - Configurações</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; padding: 16px; font-size: 14px; width: 320px; }
    h1 { font-size: 16px; margin-bottom: 12px; color: #333; }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-weight: 500; color: #555; }
    input[type="number"], input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    .btn { width: 100%; padding: 10px; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; margin-top: 8px; }
    .btn-primary { background: #0066cc; color: white; }
    .btn-primary:hover { background: #0055aa; }
    .btn-secondary { background: #f0f0f0; color: #333; }
    .btn-secondary:hover { background: #e0e0e0; }
    .success-msg { background: #d4edda; color: #155724; padding: 8px; border-radius: 4px; margin-top: 12px; display: none; }
  </style>
</head>
<body>
  <h1>Configurações de Custos</h1>
  <form id="config-form">
    <div class="form-group">
      <label for="commissionRate">Comissão Leiloeiro (%)</label>
      <input type="number" id="commissionRate" step="0.01" min="0" max="100">
    </div>
    <div class="form-group">
      <label for="adminFee">Despesas Adm/Org/Dep (R$)</label>
      <input type="number" id="adminFee" step="0.01" min="0">
    </div>
    <div class="form-group">
      <label for="logisticsFee">Despesas Logística (R$)</label>
      <input type="number" id="logisticsFee" step="0.01" min="0">
    </div>
    <div class="form-group">
      <label for="towing">Guincho (R$)</label>
      <input type="number" id="towing" step="0.01" min="0">
    </div>
    <div class="form-group">
      <label for="extraCosts">Custos Extras (R$)</label>
      <input type="number" id="extraCosts" step="0.01" min="0">
    </div>
    <div class="form-group">
      <label for="fipeToken">Token API FIPE (opcional)</label>
      <input type="text" id="fipeToken" autocomplete="off" placeholder="fipe.api.br">
    </div>
    <button type="submit" class="btn btn-primary">Salvar</button>
    <button type="button" id="reset" class="btn btn-secondary">Restaurar Padrões</button>
    <div id="success" class="success-msg">Configurações salvas!</div>
  </form>
  <script src="popup.global.js"></script>
</body>
</html>
