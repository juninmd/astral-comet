<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leilão FIPE Helper - Configurações</title>
  <style>
    :root {
      --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --bg: #f8fafc; --surface: #fff;
      --accent: #4f46e5; --accent-strong: #4338ca; --good: #059669; --good-bg: #ecfdf5;
    }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #f1f5f9; --muted: #94a3b8; --line: #334155; --bg: #0f172a; --surface: #1e293b; --accent: #818cf8; --accent-strong: #6366f1; --good: #34d399; --good-bg: #064e3b; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 13px; width: 340px; background: var(--bg); color: var(--ink); }
    header { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; }
    .logo { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,.18); font-size: 18px; }
    h1 { font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
    header p { font-size: 11px; opacity: .8; margin-top: 1px; }
    form { padding: 12px 16px 16px; }
    .section { margin-bottom: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
    .section h2 { margin-bottom: 8px; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .form-group { margin-bottom: 10px; }
    .form-group:last-child { margin-bottom: 0; }
    label { display: block; margin-bottom: 4px; font-size: 12px; font-weight: 600; }
    .field { position: relative; }
    .field .affix { position: absolute; top: 50%; transform: translateY(-50%); font-size: 12px; font-weight: 600; color: var(--muted); pointer-events: none; }
    .field .affix.pre { left: 11px; }
    .field .affix.post { right: 11px; }
    .field.has-pre input { padding-left: 32px; }
    .field.has-post input { padding-right: 28px; }
    input[type="number"], input[type="text"] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 13px; background: var(--bg); color: var(--ink); transition: border-color .15s, box-shadow .15s; }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(129, 140, 248, .3); background: var(--surface); }
    input:invalid { border-color: #dc2626; }
    .hint { margin-top: 4px; font-size: 11px; color: var(--muted); }
    .actions { display: flex; gap: 8px; }
    .btn { flex: 1; padding: 10px; border: 0; border-radius: 10px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; transition: background .15s, transform .1s; }
    .btn:active { transform: scale(.98); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn-primary { flex: 1.6; background: var(--accent-strong); color: #fff; }
    .btn-primary:hover { background: var(--accent); }
    .btn-secondary { background: var(--line); color: var(--ink); }
    .btn-secondary:hover { filter: brightness(.95); }
    .success-msg { display: none; margin-top: 10px; padding: 9px 12px; border-radius: 10px; background: var(--good-bg); color: var(--good); font-weight: 600; text-align: center; animation: pop .2s ease; }
    @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">🚗</div>
    <div>
      <h1>Leilão FIPE Helper</h1>
      <p>Configurações de custos</p>
    </div>
  </header>
  <form id="config-form">
    <div class="section">
      <h2>Taxas do leilão</h2>
      <div class="form-group">
        <label for="commissionRate">Comissão Leiloeiro (%)</label>
        <div class="field has-post"><input type="number" id="commissionRate" step="0.01" min="0" max="100"><span class="affix post">%</span></div>
      </div>
      <div class="form-group">
        <label for="adminFee">Despesas Adm/Org/Dep (R$)</label>
        <div class="field has-pre"><span class="affix pre">R$</span><input type="number" id="adminFee" step="0.01" min="0"></div>
      </div>
      <div class="form-group">
        <label for="logisticsFee">Despesas Logística (R$)</label>
        <div class="field has-pre"><span class="affix pre">R$</span><input type="number" id="logisticsFee" step="0.01" min="0"></div>
        <p class="hint">Usadas só quando o lote não informa o valor.</p>
      </div>
    </div>
    <div class="section">
      <h2>Seus custos</h2>
      <div class="form-group">
        <label for="towing">Guincho (R$)</label>
        <div class="field has-pre"><span class="affix pre">R$</span><input type="number" id="towing" step="0.01" min="0"></div>
      </div>
      <div class="form-group">
        <label for="extraCosts">Custos Extras (R$)</label>
        <div class="field has-pre"><span class="affix pre">R$</span><input type="number" id="extraCosts" step="0.01" min="0"></div>
      </div>
    </div>
    <div class="section">
      <h2>API FIPE</h2>
      <div class="form-group">
        <label for="fipeToken">Token API FIPE (opcional)</label>
        <input type="text" id="fipeToken" autocomplete="off" placeholder="fipe.api.br">
        <p class="hint">Aumenta o limite diário de consultas.</p>
      </div>
    </div>
    <div class="actions">
      <button type="button" id="reset" class="btn btn-secondary">Restaurar Padrões</button>
      <button type="submit" class="btn btn-primary">Salvar</button>
    </div>
    <div id="success" class="success-msg" role="status">Configurações salvas!</div>
  </form>
  <script src="popup.global.js"></script>
</body>
</html>
